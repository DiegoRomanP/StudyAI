openapi: 3.0.3
info:
  title: StudyAI API
  version: 0.1.0
  description: >
    Contrato mantenido de la API de StudyAI, incluidos el ciclo revisionado de
    credenciales LLM y los errores normalizados de proveedores. El backend
    (FastAPI) sirve además el esquema OpenAPI completo y en vivo en /openapi.json
    y Swagger UI en /docs.
servers:
  - url: http://localhost:8001

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK

  /documents/upload:
    post:
      summary: Sube un documento (.pdf o .md) e inicia su indexación
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Documento creado (status PENDING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { description: Tipo o tamaño inválido }

  /documents:
    get:
      summary: Lista los documentos del usuario
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }

  /documents/{document_id}:
    get:
      summary: Detalle de un documento (para hacer polling del status)
      parameters:
        - { name: document_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
    delete:
      summary: Elimina un documento (registro, archivo almacenado y vectores indexados)
      parameters:
        - { name: document_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Eliminado }
        "404": { description: Documento no encontrado }

  /goals:
    post:
      summary: Crea una meta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalCreate" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
    get:
      summary: Lista metas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Goal" }

  /goals/{goal_id}:
    get:
      summary: Detalle de una meta
      parameters:
        - { name: goal_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
    put:
      summary: Actualiza una meta (campos parciales; omitidos quedan sin cambios)
      parameters:
        - { name: goal_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "404": { description: Meta no encontrada }
    delete:
      summary: >-
        Elimina una meta. Cascada explícita: también elimina cualquier plan
        generado a partir de ella (y, con ellos, sus sesiones, quizzes y
        repasos de flashcards) — ver PlanService.delete_plan.
      parameters:
        - { name: goal_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Eliminada }
        "404": { description: Meta no encontrada }

  /plans/generate:
    post:
      summary: Inicia la generación asíncrona de un plan
      description: >-
        Acepta una cabecera Idempotency-Key opcional (1–255 caracteres). Para
        el mismo usuario, la misma clave y el mismo goal_id/document_ids
        canónicos (document_ids se compara como un conjunto ordenado), devuelve
        el mismo plan y no registra otra tarea. Reutilizar la clave con otro
        payload devuelve 409. Sin clave, conserva el comportamiento anterior y
        crea un plan nuevo. La tarea usa FastAPI BackgroundTasks en el proceso
        actual; no es una cola durable ni garantiza recuperación tras un cierre.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal_id]
              properties:
                goal_id: { type: integer }
                document_ids:
                  type: array
                  items: { type: integer }
      responses:
        "202":
          description: Aceptado; una repetición devuelve el estado actual del mismo plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanStatus" }
        "429":
          description: Se agotó el cupo diario de la IA gratuita incluida (code FREE_AI_DAILY_LIMIT); no se crea el plan
          content:
            application/json:
              schema:
                type: object
                required: [detail, code]
                properties:
                  detail: { type: string }
                  code: { type: string, example: FREE_AI_DAILY_LIMIT }
        "409":
          description: La clave de idempotencia ya se utilizó con una solicitud diferente
          content:
            application/json:
              schema:
                type: object
                required: [detail, code]
                properties:
                  detail: { type: string }
                  code: { type: string, example: IDEMPOTENCY_KEY_REUSED }

  /plans/{plan_id}/status:
    get:
      summary: Estado de generación del plan (para polling)
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanStatus" }

  /plans/{plan_id}:
    get:
      summary: Plan completo (temas + sesiones)
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
    delete:
      summary: >-
        Elimina un plan (sesiones, quizzes y repasos de flashcards asociados
        se eliminan con él).
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Eliminado }
        "404": { description: Plan no encontrado }

  /sessions/{session_id}:
    get:
      summary: Detalle de una sesión (material incluido)
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }

  /sessions/{session_id}/reinforcement:
    post:
      summary: Refuerza un repaso con IA (1 llamada; gasta 1 uso gratis si la IA es la incluida)
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "202":
          description: Aceptado; reinforcement_status = PROCESSING (idempotente si ya lo estaba).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404": { description: Sesión no encontrada }
        "409": { description: REINFORCEMENT_NOT_AVAILABLE — no es un repaso pendiente, o ya está READY }
        "429": { description: FREE_AI_DAILY_LIMIT — sin usos gratis hoy; el estado vuelve a NONE }

  /sessions/{session_id}/reinforcement/cancel:
    post:
      summary: PROCESSING → NONE; en cualquier otro estado no hace nada (no devuelve el uso)
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404": { description: Sesión no encontrada }

  /sessions/{session_id}/complete:
    post:
      summary: Marca una sesión como completada
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }

  /quizzes/{session_id}:
    get:
      summary: Quiz de una sesión
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }

  /quizzes/{quiz_id}/submit:
    post:
      summary: Envía respuestas; califica y actualiza SM-2
      parameters:
        - { name: quiz_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      question_id: { type: integer }
                      selected_option: { type: string, nullable: true }
                      quality: { type: integer, minimum: 0, maximum: 5, nullable: true }
      responses:
        "200": { description: Resultado del quiz }
        "409":
          description: >
            QUIZ_OUTDATED — alguna respuesta nombra una pregunta que el quiz ya no tiene
            (p. ej. lo reemplazó un refuerzo con IA). No se guarda resultado.

  /dashboard:
    get:
      summary: Métricas de progreso (scores, temas débiles, próximas revisiones)
      responses:
        "200": { description: OK }

  /llm-settings/catalog:
    get:
      summary: Metadatos estáticos de los proveedores LLM soportados (para construir el formulario)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProviderCatalogEntry" }

  /llm-settings/runtime:
    get:
      summary: Describe la fuente LLM efectiva sin probar conectividad ni exponer secretos
      responses:
        "200":
          description: Fuente seleccionada por la misma precedencia que usa la generación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMRuntime" }

  /llm-settings:
    get:
      summary: Lista las claves configuradas por el usuario (clave siempre enmascarada)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LLMCredential" }

  /llm-settings/{provider}:
    put:
      summary: >-
        Crea o reemplaza solo la clave de un proveedor. El selector de modelo
        queda disponible de inmediato, pero el modelo/URL se guarda como
        borrador con PATCH y se prueba después contra esa misma revisión.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [ANTHROPIC, OPENAI, GLM, OPENROUTER, NVIDIA, HUGGINGFACE, OLLAMA, GEMINI] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string, nullable: true, description: "Obligatoria salvo para OLLAMA" }
                base_url: { type: string, description: "Override opcional para proveedores compatibles; Anthropic, Google Gemini, NVIDIA y Ollama no lo admiten" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMCredential" }
        "400": { description: Clave inválida, URL base inválida o SSRF (resuelve a una IP privada/interna) }
    delete:
      summary: Elimina la clave guardada de un proveedor
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [ANTHROPIC, OPENAI, GLM, OPENROUTER, NVIDIA, HUGGINGFACE, OLLAMA, GEMINI] } }
      responses:
        "204": { description: Eliminada }
        "404": { description: No hay clave configurada para ese proveedor }

  /llm-settings/{provider}/model:
    patch:
      summary: >-
        Guarda el borrador de modelo y URL de una revisión vigente. No hace una
        llamada externa; invalida la evidencia y desactiva la credencial si hay
        un cambio real. Omitir base_url conserva la anterior; "" restaura la URL
        predeterminada.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [ANTHROPIC, OPENAI, GLM, OPENROUTER, NVIDIA, HUGGINGFACE, OLLAMA, GEMINI] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model, expected_revision]
              properties:
                model:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: >-
                    ID del modelo. Gemini admite nombres de recurso separados por "/";
                    cada segmento debe comenzar con una letra ASCII o dígito y continuar
                    solo con letras ASCII, dígitos, punto, guion o guion bajo. No se
                    permiten segmentos vacíos, "." ni "..".
                base_url: { type: string, nullable: true, description: "Omitida o null conserva la URL anterior; cadena vacía restaura la predeterminada; Anthropic, Google Gemini, NVIDIA y Ollama no admiten overrides" }
                expected_revision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMCredential" }
        "400": { description: Modelo vacío o no admitido por el proveedor, o URL base inválida/SSRF }
        "404": { description: No hay clave configurada para ese proveedor }
        "409": { description: La revisión esperada ya no es la configuración vigente }

  /llm-settings/{provider}/activate:
    post:
      summary: >-
        Activa una revisión ya verificada (y desactiva cualquier otra). Tener un
        modelo no es evidencia: la prueba debe coincidir con la revisión y URL
        efectivas.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [ANTHROPIC, OPENAI, GLM, OPENROUTER, NVIDIA, HUGGINGFACE, OLLAMA, GEMINI] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMCredential" }
        "404": { description: No hay clave configurada para ese proveedor }
        "409": { description: Configuración desactualizada o sin evidencia vigente }

  /llm-settings/{provider}/test:
    post:
      summary: Prueba con una llamada mínima el modelo y URL del borrador guardado
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [ANTHROPIC, OPENAI, GLM, OPENROUTER, NVIDIA, HUGGINGFACE, OLLAMA, GEMINI] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Evidencia guardada para la revisión probada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  credential: { $ref: "#/components/schemas/LLMCredential" }
        "404": { description: No hay clave configurada para ese proveedor }
        "409": { description: La configuración cambió durante o antes de la prueba }
        "422": { description: expected_revision inválida o campos no permitidos }
        "502":
          description: La llamada al proveedor falló con una clasificación segura.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMProviderError" }

  /llm-settings/deactivate-all:
    post:
      summary: Desactiva cualquier clave activa (usa la configuración del servidor o mock)
      responses:
        "204": { description: OK }

  /llm-settings/{provider}/models:
    get:
      summary: Lista los modelos instalados localmente en Ollama (excluye modelos cloud)
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [OLLAMA] } }
      responses:
        "200": { description: Inventario de modelos locales }
        "400": { description: El proveedor no admite descubrimiento de modelos }
        "502": { description: Ollama no está disponible o devolvió una respuesta inválida }

components:
  schemas:
    Document:
      type: object
      properties:
        id: { type: integer }
        filename: { type: string }
        file_type: { type: string }
        file_size: { type: integer }
        status: { type: string, enum: [PENDING, INDEXED, FAILED] }
        created_at: { type: string, format: date-time }
    GoalCreate:
      type: object
      required: [title]
      properties:
        goal_type: { type: string, enum: [EXAM, LEARNING, MEMORIZATION] }
        title: { type: string }
        description: { type: string }
    GoalUpdate:
      type: object
      description: All fields optional — only the ones provided are changed.
      properties:
        goal_type: { type: string, enum: [EXAM, LEARNING, MEMORIZATION] }
        title: { type: string }
        description: { type: string }
    Goal:
      allOf:
        - $ref: "#/components/schemas/GoalCreate"
        - type: object
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }
    PlanStatus:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [PROCESSING, READY, FAILED] }
        error_message: { type: string }
    Plan:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string, enum: [PROCESSING, READY, FAILED] }
        goal_id: { type: integer }
        document_ids:
          type: array
          items: { type: integer }
        error_message:
          type: string
          description: Mensaje saneado del fallo, vacío si status != FAILED.
        topics:
          type: array
          items: { $ref: "#/components/schemas/PlanTopic" }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }
    PlanTopic:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        subtopics:
          type: array
          items: { type: string }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        relevance: { type: number }
        selected: { type: boolean }
        mastery:
          type: number
          nullable: true
          description: Dominio 0..1 (media móvil de los exámenes); null = sin datos (cuenta como 0.5).
        review_box:
          type: integer
          description: Escalón de la escalera de repasos (REVIEW_INTERVALS_DAYS).
        mastery_state:
          type: string
          enum: [SIN_DATOS, REFORZAR, EN_PROGRESO, DOMINADO]
        priority:
          type: number
          description: relevance × (1 − dominio); decide qué repaso va primero.
    SessionSummary:
      type: object
      properties:
        id: { type: integer }
        order_index: { type: integer }
        topic_name: { type: string }
        duration_minutes: { type: integer }
        review_offset_days: { type: integer }
        status: { type: string, enum: [PENDING, COMPLETED] }
        kind: { type: string, enum: [NEW, REVIEW] }
        topic_id: { type: integer, nullable: true }
        scheduled_date:
          type: string
          format: date
          nullable: true
          description: Fecha sugerida (UTC). Null en sesiones anteriores a la ruta adaptativa.
        reinforcement_status: { type: string, enum: [NONE, PROCESSING, READY, FAILED] }
    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/SessionSummary"
        - type: object
          properties:
            plan_id: { type: integer }
            completed_at: { type: string, format: date-time, nullable: true }
            material:
              type: object
              nullable: true
              properties:
                content_markdown: { type: string }
                youtube_keywords:
                  type: array
                  items: { type: string }
            review_points:
              type: array
              description: Preguntas falladas del examen que creó este repaso.
              items:
                type: object
                properties:
                  prompt: { type: string }
                  answer: { type: string }
            reinforcement_error: { type: string }
    ProviderCatalogEntry:
      type: object
      properties:
        provider: { type: string, enum: [ANTHROPIC, OPENAI, GLM, OPENROUTER, NVIDIA, HUGGINGFACE, OLLAMA, GEMINI] }
        label: { type: string }
        requires_model_selection: { type: boolean }
        default_model: { type: string }
        default_base_url: { type: string, nullable: true }
        common_models:
          type: array
          description: Ordenados con los modelos gratuitos primero, luego de más barato a más caro.
          items:
            type: object
            properties:
              id: { type: string }
              free: { type: boolean }
        key_placeholder:
          type: string
          description: Sugerencia visual del formato de clave de este proveedor (p. ej. "hf_...").
        requires_api_key: { type: boolean }
        supports_model_discovery: { type: boolean }
        supports_custom_base_url:
          type: boolean
          description: Si admite un override de URL base; Anthropic, Google Gemini, NVIDIA y Ollama no lo admiten.
        allows_custom_model:
          type: boolean
          description: Si admite IDs de modelo no presentes en el catálogo. NVIDIA solo permite sus modelos con contrato StudyAI validado.
    LLMCredential:
      type: object
      description: La clave real nunca se expone; solo un fragmento enmascarado.
      properties:
        provider: { type: string, enum: [ANTHROPIC, OPENAI, GLM, OPENROUTER, NVIDIA, HUGGINGFACE, OLLAMA, GEMINI] }
        label: { type: string }
        masked_api_key: { type: string, example: "sk-a••••••9f2k" }
        model:
          type: string
          description: Borrador del modelo elegido; vacío si aún no se eligió uno.
        base_url: { type: string }
        is_active: { type: boolean }
        config_revision: { type: integer, minimum: 1 }
        is_verified:
          type: boolean
          description: Evidencia del servidor vigente para el modelo, URL y revisión actuales.
        verified_at: { type: string, format: date-time, nullable: true }
        requires_model_selection: { type: boolean }
        requires_api_key: { type: boolean }
        supports_model_discovery: { type: boolean }
        supports_custom_base_url: { type: boolean }
        allows_custom_model: { type: boolean }
        created_at: { type: string, format: date-time }
    LLMRuntime:
      type: object
      required: [source, provider, models, fallback_reason]
      description: Estado de selección; no garantiza conectividad futura ni contiene claves.
      properties:
        source: { type: string, enum: [USER, ENV, MOCK] }
        provider:
          type: string
          enum: [ANTHROPIC, OPENAI, GLM, OPENROUTER, NVIDIA, HUGGINGFACE, OLLAMA, GEMINI]
          nullable: true
          description: Nulo solo si source es MOCK; USER requiere un proveedor real y ENV requiere ANTHROPIC, salvo bundled=true (NVIDIA o GEMINI).
        models:
          type: object
          required: [topic_analysis, session_plan, session_content]
          additionalProperties: false
          properties:
            topic_analysis: { type: string, minLength: 1 }
            session_plan: { type: string, minLength: 1 }
            session_content: { type: string, minLength: 1 }
          description: Modelo efectivo por tipo de llamada de generación; para Anthropic de .env, topic_analysis y session_plan usan LLM_MODEL_PLAN y session_content usa LLM_MODEL_QUIZ. MOCK usa "simulado" para las tres claves.
        fallback_reason:
          type: string
          nullable: true
          description: Motivo público saneado cuando se degradó desde una fuente de mayor prioridad.
        bundled:
          type: boolean
          default: false
          description: Verdadero cuando responde la IA gratuita incluida del servidor (NVIDIA y luego Gemini); el usuario no elige modelo.
        free_ai:
          type: object
          nullable: true
          required: [limit, used, remaining]
          description: Cupo del día (UTC) de la IA gratuita incluida; nulo si el servidor no la ofrece. Cada generación de plan gasta un uso y se devuelve si falla.
          properties:
            limit: { type: integer, minimum: 1 }
            used: { type: integer, minimum: 0 }
            remaining: { type: integer, minimum: 0 }
    LLMProviderError:
      type: object
      required: [detail, code, retryable]
      properties:
        detail:
          type: string
          description: Mensaje público saneado; no contiene cuerpos upstream ni secretos.
        code:
          type: string
          enum: [LLM_AUTHENTICATION_FAILED, LLM_ACCESS_DENIED, LLM_ASYNC_RESULT_UNAVAILABLE, LLM_QUOTA_EXHAUSTED, LLM_MODEL_UNAVAILABLE, LLM_ENDPOINT_OR_MODEL_UNAVAILABLE, LLM_UNSUPPORTED_REQUEST, LLM_UNSUPPORTED_CONFIGURATION, LLM_RATE_LIMITED, LLM_TIMEOUT, LLM_CONNECTION_FAILED, LLM_PROVIDER_UNAVAILABLE, LLM_OUTPUT_LIMIT, LLM_REFUSED, LLM_INVALID_RESPONSE, LLM_PROVIDER_ERROR]
        provider: { type: string, nullable: true }
        upstream_status: { type: integer, nullable: true }
        retryable: { type: boolean }
        retry_after_seconds: { type: number, nullable: true }
