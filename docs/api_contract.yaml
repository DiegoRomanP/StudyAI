openapi: 3.0.3
info:
  title: StudyAI API
  version: 0.1.0
  description: >
    Contrato mantenido de la API de StudyAI, incluidos el ciclo revisionado de
    credenciales LLM y los errores normalizados de proveedores. El backend
    (FastAPI) sirve además el esquema OpenAPI completo y en vivo en /openapi.json
    y Swagger UI en /docs.

    Autenticación: con AUTH_MODE=supabase toda ruta (salvo /health y /config)
    exige `Authorization: Bearer <JWT de Supabase>` y puede responder 401
    `AUTH_REQUIRED` (sin token), 401 `AUTH_INVALID_TOKEN` (token inválido o
    vencido) y 409 `AUTH_EMAIL_CONFLICT` (el correo ya pertenece a otra
    cuenta); ver `components.responses`. Con AUTH_MODE=demo no hay cabecera y
    el usuario es siempre el demo.
servers:
  - url: http://localhost:8001

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK

  /config:
    get:
      summary: Modo de despliegue (la UI oculta lo que no aplica; el backend siempre valida)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployment_mode: { type: string, enum: [self_hosted, saas] }
                  auth_mode: { type: string, enum: [demo, supabase] }

  /documents/upload:
    post:
      summary: Sube un documento (.pdf o .md) e inicia su indexación
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Documento creado (status PENDING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { description: "Tipo, tamaño, PDF corrupto, PDF protegido con contraseña o PDF con más de MAX_PDF_PAGES páginas" }
        "403": { $ref: "#/components/responses/PlanLimitReached" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /documents:
    get:
      summary: Lista los documentos del usuario
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }

  /documents/figures/{asset_id}:
    get:
      summary: PNG de una figura extraída de un PDF del usuario (404 si no existe o es de otro usuario)
      parameters:
        - { name: asset_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: La figura
          content:
            image/png: {}
        "404": { description: Figura no encontrada }

  /documents/{document_id}:
    get:
      summary: Detalle de un documento (para hacer polling del status)
      parameters:
        - { name: document_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
    delete:
      summary: Elimina un documento (registro, archivo almacenado y vectores indexados)
      parameters:
        - { name: document_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Eliminado }
        "404": { description: Documento no encontrado }

  /goals:
    post:
      summary: Crea una meta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalCreate" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "403": { $ref: "#/components/responses/PlanLimitReached" }
    get:
      summary: Lista metas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Goal" }

  /goals/{goal_id}:
    get:
      summary: Detalle de una meta
      parameters:
        - { name: goal_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
    put:
      summary: Actualiza una meta (campos parciales; omitidos quedan sin cambios)
      parameters:
        - { name: goal_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "404": { description: Meta no encontrada }
    delete:
      summary: >-
        Elimina una meta (borrado lógico). Deja de aparecer y no admite planes
        nuevos, pero sus planes, sesiones, resultados y repasos se conservan;
        un plan se borra solo con DELETE /plans/{plan_id}.
      parameters:
        - { name: goal_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Eliminada }
        "404": { description: Meta no encontrada }

  /goals/{goal_id}/archive:
    post:
      summary: Archiva una meta (deja de contar como activa; conserva planes e historial)
      description: Idempotente. Una meta archivada sigue en `GET /goals` con `archived_at` informado.
      parameters:
        - { name: goal_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: La meta, con `archived_at`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "404": { description: Meta no encontrada }

  /goals/{goal_id}/unarchive:
    post:
      summary: Reactiva una meta archivada (cuenta de nuevo como activa)
      description: Idempotente. Si el usuario ya está en su máximo de metas activas responde 403.
      parameters:
        - { name: goal_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: La meta, con `archived_at` = null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "403": { $ref: "#/components/responses/PlanLimitReached" }
        "404": { description: Meta no encontrada }

  /account/credits:
    get:
      summary: Saldo de créditos, nivel y límites del usuario
      description: >-
        En `saas` el nivel se calcula (pase vigente = pass; alguna compra = credits;
        si no, free). En `self_hosted` no hay créditos: saldos en 0 y límites null.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditBalance" }

  /account/credits/history:
    get:
      summary: Movimientos de créditos del usuario, del más reciente al más antiguo
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CreditLedgerEntry" }

  /billing/products:
    get:
      summary: Paquetes y pase activos (para /precios)
      description: >-
        Solo existe en `DEPLOYMENT_MODE=saas`; en `self_hosted` todo `/billing/*` responde 404.
        Montos en céntimos de sol (`price_cents`), nunca decimales.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
        "404": { description: self_hosted (no hay cobros) }

  /billing/checkout:
    post:
      summary: Crea una orden pendiente y devuelve la URL de pago de la pasarela
      description: >-
        El monto y la moneda salen siempre de `products` en el servidor; cualquier monto que
        envíe el cliente se ignora. La misma `idempotency_key` del mismo usuario y producto
        devuelve la misma orden (y la misma URL). Reusar la clave con otro producto o desde otra
        cuenta → 409 `IDEMPOTENCY_CONFLICT`. Nunca se acredita desde la redirección del
        navegador: solo el webhook verificado (o la consulta del backend a la pasarela) marca
        la orden como pagada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200":
          description: Orden creada (o la existente para esa clave)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
        "404": { description: Producto inexistente o inactivo; o self_hosted }
        "409":
          description: 409 IDEMPOTENCY_CONFLICT (clave reutilizada con otro producto o usuario)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: 502 PAYMENT_GATEWAY_ERROR (la pasarela no creó el checkout; la orden queda pending y un reintento con la misma clave lo vuelve a intentar)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /billing/webhooks/{gateway}:
    post:
      summary: Notificación de la pasarela (sin usuario ni cookies; verificada por firma)
      description: >-
        `gateway` debe coincidir con `PAYMENT_GATEWAY`, si no → 404. Mercado Pago envía
        `?data.id=<pago>&type=payment` (la `notification_url` lleva `?source_news=webhooks` para no recibir IPN antiguos, que no traen firma válida) y las cabeceras `x-signature: ts=<ts>,v1=<hmac>` y
        `x-request-id`. El backend recalcula HMAC-SHA256(`MP_WEBHOOK_SECRET`,
        `id:<data.id>;request-id:<x-request-id>;ts:<ts>;`) y lo compara en tiempo constante;
        firma ausente o inválida → 400 `WEBHOOK_INVALID`. Después consulta el pago a la API de la
        pasarela (`GET /v1/payments/{id}`) y lo aplica una sola vez (`payment_events.event_id`
        único + `UPDATE orders ... WHERE status='pending'`). Monto o moneda distintos a los de la
        orden → no acredita y la orden sigue pending. Notificaciones de otro tipo (no `payment`)
        se aceptan con 200 y se ignoran.
      security: []
      parameters:
        - { name: gateway, in: path, required: true, schema: { type: string, enum: [mercadopago, fake] } }
        - { name: data.id, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Recibido (procesado, duplicado o ignorado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, example: true }
        "400":
          description: 400 WEBHOOK_INVALID (firma ausente o inválida)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiError"
                  - type: object
                    properties:
                      code: { type: string, example: WEBHOOK_INVALID }
        "404": { description: Pasarela distinta de PAYMENT_GATEWAY; o self_hosted }

  /billing/orders:
    get:
      summary: Historial de compras del usuario, de la más reciente a la más antigua
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "404": { description: self_hosted }

  /billing/orders/{order_id}:
    get:
      summary: Estado de una orden (polling en /pago/resultado hasta paid)
      parameters:
        - { name: order_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { description: No existe o no es del usuario (no se distingue); o self_hosted }

  /billing/fake/complete/{order_id}:
    post:
      summary: "Desarrollo: simula el pago aprobado de una orden (D10)"
      description: >-
        Solo existe con `PAYMENT_GATEWAY=fake` y `APP_ENV` distinto de `production` (si no, 404).
        Recorre el mismo `BillingService.apply_payment` que el webhook: dos llamadas acreditan una vez.
      parameters:
        - { name: order_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Orden tras aplicar el pago
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { description: Orden ajena o inexistente; gateway real; producción; o self_hosted }

  /complaints:
    post:
      summary: Libro de Reclamaciones (Perú). Público, sin sesión
      description: >-
        Registra un reclamo o queja y devuelve su código correlativo por año
        (`R-<año>-<6 dígitos>`). `amount_cents` es el monto reclamado en céntimos de sol (null si
        no aplica). Límite: 5 por hora por IP en saas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintCreate" }
      responses:
        "201":
          description: Registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintCreated" }
        "422": { description: Campos faltantes o inválidos }
        "429": { $ref: "#/components/responses/RateLimited" }

  /plans/generate:
    post:
      summary: Inicia la generación asíncrona de un plan
      description: >-
        Acepta una cabecera Idempotency-Key opcional (1–255 caracteres). Para
        v1, la misma clave y el mismo goal_id/document_ids canónicos (document_ids
        se compara como un conjunto ordenado) conserva exactamente la identidad
        anterior. Para v2, la identidad también incluye la versión y el hint
        efectivo normalizado; history/critical_argumentative y
        mathematics/logical_deductive son aliases equivalentes. Reutilizar la
        clave entre versiones o con otro hint efectivo devuelve 409. Sin clave,
        conserva el comportamiento anterior y crea un plan nuevo. La tarea usa
        FastAPI BackgroundTasks en el proceso
        actual; no es una cola durable. Si la generación falla, o el servidor se
        reinicia a mitad (al arrancar, todo plan PROCESSING pasa a FAILED), el plan
        conserva lo generado y se puede continuar con `/plans/{plan_id}/resume`.
        Cada document_id debe existir, pertenecer al usuario y estar INDEXED;
        si no, o si la lista está vacía, responde 400 y no crea el plan. Un ID
        ajeno se informa igual que uno inexistente. La validación ocurre después
        de comprobar la idempotencia: repetir una solicitud ya aceptada devuelve
        su plan aunque un documento se haya borrado después.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal_id]
              properties:
                goal_id: { type: integer }
                document_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
                content_version:
                  type: integer
                  enum: [1, 2]
                  default: 1
                  description: >-
                    Versión de contenido. El valor 1 conserva exactamente la
                    solicitud e identidad públicas actuales; el valor 2 habilita
                    la solicitud/persistencia versionada del hint académico. Este
                    slice todavía no adapta la generación, los prompts ni el
                    contenido de las sesiones.
                subject_hint:
                  type: string
                  nullable: true
                  enum: [auto, history, mathematics, general]
                  description: >-
                    Hint legado, válido solo con content_version=2. En v2, history
                    corresponde a critical_argumentative, mathematics a
                    logical_deductive y general conserva el fallback técnico. Si
                    se omite en v2 se resuelve como auto; en v1 debe omitirse o ser
                    null. Un hint no nulo con content_version=1 devuelve 422.
                profile_hint:
                  type: string
                  nullable: true
                  enum:
                    - logical_deductive
                    - critical_argumentative
                    - linguistic_interpretive
                    - systemic_empirical
                    - applied_practical
                    - auto
                  description: >-
                    Hint académico opcional, solo para content_version=2; omitido
                    o null equivale a no enviar un perfil. Se guarda en
                    Plan.profile_hint sin valor histórico inferido. En v1, cualquier
                    profile_hint suministrado, incluso null, devuelve 422. No acepta
                    history, mathematics ni general; esos son valores de
                    subject_hint. Si ambos hints se envían explícitamente, solo se
                    aceptan los pares history/critical_argumentative,
                    mathematics/logical_deductive y auto/auto. El auto de
                    subject_hint sintetizado al omitirlo no causa conflicto. Una
                    petición inválida devuelve 422. Este contrato aún no modifica
                    prompts ni generación adaptativa.
      responses:
        "202":
          description: Aceptado; una repetición devuelve el estado actual del mismo plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanStatus" }
        "400":
          description: >-
            Algún documento no existe, no pertenece al usuario o no está
            INDEXED (o no se envió ninguno); document_ids lista los afectados
          content:
            application/json:
              schema:
                type: object
                required: [detail, code, document_ids]
                properties:
                  detail: { type: string }
                  code: { type: string, example: PLAN_DOCUMENTS_UNAVAILABLE }
                  document_ids:
                    type: array
                    items: { type: integer }
        "402": { $ref: "#/components/responses/InsufficientCredits" }
        "429":
          description: Se agotó el cupo diario de la IA gratuita incluida (code FREE_AI_DAILY_LIMIT; solo self_hosted); no se crea el plan. En saas, RATE_LIMITED con Retry-After (10/hora, ver components/responses/RateLimited)
          content:
            application/json:
              schema:
                type: object
                required: [detail, code]
                properties:
                  detail: { type: string }
                  code: { type: string, example: FREE_AI_DAILY_LIMIT }
        "409":
          description: La clave de idempotencia ya se utilizó con una solicitud diferente
          content:
            application/json:
              schema:
                type: object
                required: [detail, code]
                properties:
                  detail: { type: string }
                  code: { type: string, example: IDEMPOTENCY_KEY_REUSED }

  /plans/{plan_id}/resume:
    post:
      summary: Continúa una generación incompleta (FAILED) sin repetir lo ya generado
      description: >-
        Pasa el plan de FAILED a PROCESSING y genera solo lo que falta (temas,
        sesiones o el contenido de las sesiones sin material). Repetir la
        petición mientras está en PROCESSING devuelve el mismo estado sin lanzar
        otra tarea. Con la IA gratuita incluida gasta un uso, que se devuelve si
        vuelve a fallar; con la IA propia, Ollama o el modo demo no cuenta.
        En `saas` reanudar cuesta 0 créditos.
        Repetir `/plans/generate` con la misma Idempotency-Key no reanuda.
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: integer } }
      responses:
        "202":
          description: Aceptado; el plan queda en PROCESSING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanStatus" }
        "404":
          description: Plan no encontrado
        "409":
          description: El plan no está FAILED (code PLAN_NOT_RESUMABLE)
          content:
            application/json:
              schema:
                type: object
                required: [detail, code]
                properties:
                  detail: { type: string }
                  code: { type: string, example: PLAN_NOT_RESUMABLE }
        "429":
          description: Se agotó el cupo diario de la IA gratuita incluida (code FREE_AI_DAILY_LIMIT); el plan sigue FAILED con su mensaje. En saas, RATE_LIMITED con Retry-After (comparte cubo con /plans/generate)
          content:
            application/json:
              schema:
                type: object
                required: [detail, code]
                properties:
                  detail: { type: string }
                  code: { type: string, example: FREE_AI_DAILY_LIMIT }

  /plans/{plan_id}/status:
    get:
      summary: Estado de generación del plan (para polling)
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanStatus" }

  /plans:
    get:
      summary: Planes del usuario
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Plan" } }

  /plans/{plan_id}:
    get:
      summary: Plan completo (temas + sesiones)
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
    delete:
      summary: >-
        Elimina un plan (sesiones, quizzes y repasos de flashcards asociados
        se eliminan con él).
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Eliminado }
        "404": { description: Plan no encontrado }

  /sessions/{session_id}:
    get:
      summary: Detalle de una sesión (material incluido)
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }

  /sessions/{session_id}/learning-mode:
    get:
      summary: Versión de contenido de la sesión
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Versión disponible aunque el contenido siga en preparación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningMode" }
        "404": { description: Sesión no encontrada }
        "422": { description: Identificador de sesión inválido }

  /sessions/{session_id}/learning-v2:
    get:
      summary: Lección adaptativa con objetivos y perfil efectivos
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Lección publicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdaptiveLesson" }
        "404": { description: Sesión no encontrada }
        "409": { description: CONTENT_VERSION_MISMATCH o CONTENT_NOT_READY }
        "422": { description: Identificador de sesión inválido }

  /sessions/{session_id}/result:
    get:
      summary: Último resultado del test de la sesión (el intento más reciente)
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizResult" }
        "404": { description: Sesión no encontrada o todavía sin resultado }
        "409": { description: CONTENT_VERSION_MISMATCH para contenido v2 }

  /sessions/{session_id}/reinforcement:
    post:
      summary: Refuerza un repaso con IA (1 llamada; gasta 1 uso gratis, o 1 crédito en saas; se devuelve si falla)
      description: En v2 conserva el perfil y el ID del quiz, y abre una revisión nueva al publicar.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "202":
          description: Aceptado; reinforcement_status = PROCESSING (idempotente si ya lo estaba).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404": { description: Sesión no encontrada }
        "409":
          description: REINFORCEMENT_NOT_AVAILABLE o CONTENT_NOT_READY para contenido v2 incompleto
        "402": { $ref: "#/components/responses/InsufficientCredits" }
        "429": { description: "FREE_AI_DAILY_LIMIT — sin usos gratis hoy (solo self_hosted); el estado vuelve a NONE. En saas, RATE_LIMITED con Retry-After (20/hora, ver components/responses/RateLimited)" }

  /sessions/{session_id}/assistant:
    get:
      summary: Historial del asistente de estudio en esta sesión
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Mensajes (más antiguos primero) y mensajes gratis restantes hoy (null con IA propia)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantHistory" }
        "404": { description: Sesión no encontrada }
    post:
      summary: Pregunta al asistente (1 llamada LLM)
      description: >
        STUDY resuelve dudas con el material; EXAM solo da pistas. La clave de la pregunta nunca
        entra al prompt. Con la IA gratuita gasta 1 mensaje de FREE_AI_ASSISTANT_DAILY_LIMIT (se devuelve si falla).
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                mode: { type: string, enum: [STUDY, EXAM], default: STUDY }
                question_id: { type: string, nullable: true, maxLength: 64 }
      responses:
        "200":
          description: Pregunta y respuesta guardadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/AssistantMessage" }
                  answer: { $ref: "#/components/schemas/AssistantMessage" }
                  remaining: { type: integer, nullable: true }
        "404": { description: Sesión no encontrada }
        "429": { description: "FREE_AI_ASSISTANT_LIMIT — sin mensajes gratis del asistente hoy. En saas, RATE_LIMITED con Retry-After (60/hora, ver components/responses/RateLimited)" }

  /assistant/questions:
    get:
      summary: Preguntas que hizo el estudiante al asistente, con su respuesta (más recientes primero)
      parameters:
        - { name: plan_id, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    plan_id: { type: integer }
                    plan_title: { type: string }
                    session_id: { type: integer }
                    topic_name: { type: string }
                    mode: { type: string, enum: [STUDY, EXAM] }
                    question: { type: string }
                    answer: { type: string }
                    created_at: { type: string, format: date-time }

  /sessions/{session_id}/reinforcement/cancel:
    post:
      summary: Cancela un refuerzo en PROCESSING
      description: El worker devuelve el uso gratis de la ejecución cancelada al descartar su resultado.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404": { description: Sesión no encontrada }

  /sessions/{session_id}/complete:
    post:
      summary: Marca una sesión como completada
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
        "409": { description: CONTENT_VERSION_MISMATCH para contenido v2 }

  /quizzes/{session_id}:
    get:
      summary: Quiz de una sesión
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
        "409": { description: CONTENT_VERSION_MISMATCH para contenido v2 }

  /quizzes/{quiz_id}/submit:
    post:
      summary: Envía respuestas; califica y actualiza SM-2
      parameters:
        - { name: quiz_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      question_id: { type: integer }
                      selected_option: { type: string, nullable: true }
                      quality: { type: integer, minimum: 0, maximum: 5, nullable: true }
      responses:
        "200":
          description: Resultado del quiz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizResult" }
        "409":
          description: >
            CONTENT_VERSION_MISMATCH para contenido v2, o QUIZ_OUTDATED si alguna respuesta nombra una pregunta que el quiz ya no tiene
            (p. ej. lo reemplazó un refuerzo con IA). No se guarda resultado.

  /quizzes/{session_id}/assessment-v2:
    get:
      summary: Evaluación adaptativa publicada
      description: >-
        Devuelve la revisión, las preguntas y sus estímulos. Cada pregunta tiene
        una estimación del perfil guardado o una guía de referencia del perfil
        equivalente para snapshots históricos. Las tarjetas incluyen el texto
        de revelado. Las soluciones y el feedback respaldado se entregan al calificar.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Evaluación disponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentResponseV2" }
        "404": { description: Sesión no encontrada }
        "409":
          description: CONTENT_VERSION_MISMATCH o CONTENT_NOT_READY
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdaptiveContentConflict" }
        "422": { description: Identificador de sesión inválido }

  /quizzes/{quiz_id}/assessment-v2/submit:
    post:
      summary: Entrega la revisión publicada y actualiza el progreso
      description: >-
        Envía exactamente una respuesta por pregunta. La entrega guarda la
        nota objetiva, el desglose por objetivo y la rúbrica formativa, y
        completa la sesión en una transacción. Repetir respuestas equivalentes
        de la misma revisión recupera el resultado guardado.
      parameters:
        - { name: quiz_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentSubmissionV2" }
      responses:
        "200":
          description: Resultado de la evaluación adaptativa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentResultV2" }
        "400": { description: Respuestas inválidas o incompletas }
        "404": { description: Quiz no encontrado }
        "409":
          description: CONTENT_VERSION_MISMATCH, CONTENT_NOT_READY, QUIZ_OUTDATED o ASSESSMENT_ALREADY_SUBMITTED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdaptiveContentConflict" }
        "422": { description: Cuerpo de solicitud inválido }

  /quizzes/{session_id}/assessment-v2/result:
    get:
      summary: Recupera el resultado guardado de la revisión vigente
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Mismo resultado que la entrega
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentResultV2" }
        "404": { description: Sesión o resultado no encontrado }
        "409":
          description: CONTENT_VERSION_MISMATCH o CONTENT_NOT_READY
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdaptiveContentConflict" }
        "422": { description: Identificador de sesión inválido }

  /dashboard:
    get:
      summary: Métricas de progreso (scores, temas débiles, próximas revisiones)
      responses:
        "200": { description: OK }

  /llm-settings/catalog:
    get:
      summary: Metadatos estáticos de los proveedores LLM soportados (para construir el formulario)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProviderCatalogEntry" }

  /llm-settings/runtime:
    get:
      summary: Describe la fuente LLM efectiva sin probar conectividad ni exponer secretos
      responses:
        "200":
          description: Fuente seleccionada por la misma precedencia que usa la generación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMRuntime" }

  /llm-settings:
    get:
      summary: Lista las claves configuradas por el usuario (clave siempre enmascarada)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LLMCredential" }

  /llm-settings/{provider}:
    put:
      summary: >-
        Crea o reemplaza solo la clave de un proveedor. El selector de modelo
        queda disponible de inmediato, pero el modelo/URL se guarda como
        borrador con PATCH y se prueba después contra esa misma revisión.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [ANTHROPIC, OPENAI, DEEPSEEK, OPENROUTER, NVIDIA, OLLAMA, GEMINI, CLAUDE_CODE, OPENCODE, PI, CODEX] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string, nullable: true, description: "Obligatoria salvo para OLLAMA" }
                base_url: { type: string, description: "Override opcional para proveedores compatibles; Anthropic, Google Gemini, NVIDIA y Ollama no lo admiten" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMCredential" }
        "400": { description: Clave inválida, URL base inválida o SSRF (resuelve a una IP privada/interna) }
    delete:
      summary: Elimina la clave guardada de un proveedor
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [ANTHROPIC, OPENAI, DEEPSEEK, OPENROUTER, NVIDIA, OLLAMA, GEMINI, CLAUDE_CODE, OPENCODE, PI, CODEX] } }
      responses:
        "204": { description: Eliminada }
        "404": { description: No hay clave configurada para ese proveedor }

  /llm-settings/{provider}/model:
    patch:
      summary: >-
        Guarda el borrador de modelo y URL de una revisión vigente. No hace una
        llamada externa; invalida la evidencia y desactiva la credencial si hay
        un cambio real. Omitir base_url conserva la anterior; "" restaura la URL
        predeterminada.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [ANTHROPIC, OPENAI, DEEPSEEK, OPENROUTER, NVIDIA, OLLAMA, GEMINI, CLAUDE_CODE, OPENCODE, PI, CODEX] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model, expected_revision]
              properties:
                model:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: >-
                    ID del modelo. Gemini admite nombres de recurso separados por "/";
                    cada segmento debe comenzar con una letra ASCII o dígito y continuar
                    solo con letras ASCII, dígitos, punto, guion o guion bajo. No se
                    permiten segmentos vacíos, "." ni "..".
                base_url: { type: string, nullable: true, description: "Omitida o null conserva la URL anterior; cadena vacía restaura la predeterminada; Anthropic, Google Gemini, NVIDIA y Ollama no admiten overrides" }
                expected_revision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMCredential" }
        "400": { description: Modelo vacío o no admitido por el proveedor, o URL base inválida/SSRF }
        "404": { description: No hay clave configurada para ese proveedor }
        "409": { description: La revisión esperada ya no es la configuración vigente }

  /llm-settings/{provider}/activate:
    post:
      summary: >-
        Activa una revisión ya verificada (y desactiva cualquier otra). Tener un
        modelo no es evidencia: la prueba debe coincidir con la revisión y URL
        efectivas.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [ANTHROPIC, OPENAI, DEEPSEEK, OPENROUTER, NVIDIA, OLLAMA, GEMINI, CLAUDE_CODE, OPENCODE, PI, CODEX] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMCredential" }
        "404": { description: No hay clave configurada para ese proveedor }
        "409": { description: Configuración desactualizada o sin evidencia vigente }

  /llm-settings/{provider}/test:
    post:
      summary: Prueba con una llamada mínima el modelo y URL del borrador guardado
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [ANTHROPIC, OPENAI, DEEPSEEK, OPENROUTER, NVIDIA, OLLAMA, GEMINI, CLAUDE_CODE, OPENCODE, PI, CODEX] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Evidencia guardada para la revisión probada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  credential: { $ref: "#/components/schemas/LLMCredential" }
        "404": { description: No hay clave configurada para ese proveedor }
        "409": { description: La configuración cambió durante o antes de la prueba }
        "422": { description: expected_revision inválida o campos no permitidos }
        "502":
          description: La llamada al proveedor falló con una clasificación segura.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMProviderError" }

  /llm-settings/deactivate-all:
    post:
      summary: Desactiva cualquier clave activa (usa la configuración del servidor o mock)
      responses:
        "204": { description: OK }

  /llm-settings/{provider}/models:
    get:
      summary: >-
        Lista los modelos que el proveedor permite usar: los instalados en Ollama (sin cloud) o los
        de una IA de terminal (Claude Code: alias; OpenCode: «opencode models», gratuitos primero;
        Pi: «pi --list-models»; Codex: catálogo visible). Solo self_hosted.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [OLLAMA, CLAUDE_CODE, OPENCODE, PI, CODEX] } }
      responses:
        "200":
          description: Inventario de modelos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    size_bytes: { type: integer, nullable: true }
                    parameter_size: { type: string, nullable: true }
                    context_length: { type: integer, nullable: true }
                    free: { type: boolean, description: Modelo gratuito del harness (p. ej. opencode/*-free). }
        "400": { description: El proveedor no admite descubrimiento de modelos }
        "502": { description: Ollama no está disponible o devolvió una respuesta inválida }

components:
  responses:
    RateLimited:
      description: >-
        429 RATE_LIMITED (solo DEPLOYMENT_MODE=saas): demasiadas peticiones del mismo usuario (o IP en
        rutas públicas) en la última hora. La cabecera `Retry-After` dice en cuántos segundos reintentar.
      headers:
        Retry-After: { schema: { type: integer }, description: Segundos hasta poder reintentar }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiError"
              - type: object
                properties:
                  code: { type: string, enum: [RATE_LIMITED] }
    Unauthorized:
      description: >-
        401 con AUTH_MODE=supabase. `code` = AUTH_REQUIRED (sin cabecera Authorization)
        o AUTH_INVALID_TOKEN (token inválido, vencido o anónimo). Lleva `WWW-Authenticate: Bearer`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiError"
              - type: object
                properties:
                  code: { type: string, enum: [AUTH_REQUIRED, AUTH_INVALID_TOKEN] }
    AuthEmailConflict:
      description: 409 AUTH_EMAIL_CONFLICT. El correo del token ya pertenece a otra cuenta.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiError"
              - type: object
                properties:
                  code: { type: string, example: AUTH_EMAIL_CONFLICT }
    InsufficientCredits:
      description: >-
        402 INSUFFICIENT_CREDITS (solo saas). No quedan créditos; no se gastó nada
        y no se creó el plan ni se inició el refuerzo.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiError"
              - type: object
                properties:
                  code: { type: string, example: INSUFFICIENT_CREDITS }
    PlanLimitReached:
      description: >-
        403 PLAN_LIMIT_REACHED (solo saas). Se alcanzó el máximo de documentos o de
        metas activas del nivel del usuario.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiError"
              - type: object
                properties:
                  code: { type: string, example: PLAN_LIMIT_REACHED }
  schemas:
    AssistantMessage:
      type: object
      properties:
        id: { type: integer }
        role: { type: string, enum: [USER, ASSISTANT] }
        mode: { type: string, enum: [STUDY, EXAM] }
        content: { type: string, description: Markdown (fórmulas en $...$) }
        created_at: { type: string, format: date-time }
    AssistantHistory:
      type: object
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/AssistantMessage" } }
        remaining: { type: integer, nullable: true }
    Document:
      type: object
      properties:
        id: { type: integer }
        filename: { type: string }
        file_type: { type: string }
        file_size: { type: integer }
        status: { type: string, enum: [PENDING, INDEXED, FAILED] }
        created_at: { type: string, format: date-time }
    GoalCreate:
      type: object
      required: [title]
      properties:
        goal_type: { type: string, enum: [EXAM, LEARNING, MEMORIZATION] }
        title: { type: string }
        description: { type: string }
        exam_date: { type: string, format: date, nullable: true }
    GoalUpdate:
      type: object
      description: All fields optional — only the ones provided are changed.
      properties:
        goal_type: { type: string, enum: [EXAM, LEARNING, MEMORIZATION] }
        title: { type: string }
        description: { type: string }
        exam_date: { type: string, format: date, nullable: true }
    Goal:
      allOf:
        - $ref: "#/components/schemas/GoalCreate"
        - type: object
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }
            archived_at: { type: string, format: date-time, nullable: true }
    CreditBalance:
      type: object
      required: [purchased, pass_credits, total, tier, documents_used, active_goals_used]
      properties:
        purchased: { type: integer, description: Créditos comprados o regalados (no vencen) }
        pass_credits: { type: integer, description: Créditos del pase vigente (0 si no hay pase) }
        pass_expires_at: { type: string, format: date-time, nullable: true }
        total: { type: integer, description: "Gastable ahora: purchased + pass_credits vigentes" }
        tier: { type: string, enum: [free, credits, pass] }
        max_documents: { type: integer, nullable: true, description: null = sin límite }
        max_active_goals: { type: integer, nullable: true, description: null = sin límite }
        documents_used: { type: integer }
        active_goals_used: { type: integer, description: Metas no archivadas ni eliminadas }
    CreditLedgerEntry:
      type: object
      required: [id, delta, reason, source, balance_after, created_at]
      properties:
        id: { type: integer }
        delta: { type: integer, description: "+ abonos, - cobros" }
        reason: { type: string, enum: [signup_bonus, purchase, pass_grant, plan, reinforcement, refund, admin_adjustment, expiration] }
        source: { type: string, enum: [purchased, pass] }
        reference_type: { type: string, nullable: true, description: "plan | session | order" }
        reference_id: { type: integer, nullable: true }
        balance_after: { type: integer, description: Total gastable tras el movimiento }
        created_at: { type: string, format: date-time }
    Product:
      type: object
      required: [code, name, kind, credits, pass_days, price_cents, currency]
      properties:
        code: { type: string, example: pack_10 }
        name: { type: string }
        kind: { type: string, enum: [pack, pass], description: "pack = créditos que no vencen; pass = pase con vencimiento" }
        credits: { type: integer, description: "pack: créditos que se suman; pass: créditos del pase (se reinician, no se acumulan)" }
        pass_days: { type: integer, nullable: true, description: Solo en pass }
        price_cents: { type: integer, description: "Céntimos de sol (490 = S/ 4,90)" }
        currency: { type: string, enum: [PEN] }
    CheckoutRequest:
      type: object
      required: [product_code, idempotency_key]
      properties:
        product_code: { type: string }
        idempotency_key: { type: string, minLength: 1, maxLength: 255, description: Generada una vez por intención de compra y reutilizada en los reintentos }
    CheckoutResponse:
      type: object
      required: [order_id, checkout_url]
      properties:
        order_id: { type: integer }
        checkout_url: { type: string, description: "URL de la pasarela (con fake: {PUBLIC_APP_URL}/pago/resultado?order={id})" }
    Order:
      type: object
      required: [id, product_code, status, amount_cents, currency, created_at, paid_at]
      properties:
        id: { type: integer }
        product_code: { type: string }
        status: { type: string, enum: [pending, paid, failed, refunded] }
        amount_cents: { type: integer }
        currency: { type: string, enum: [PEN] }
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
    ComplaintCreate:
      type: object
      required: [name, document_id, address, phone, email, kind, detail, request]
      properties:
        name: { type: string }
        document_id: { type: string, description: "DNI / CE / pasaporte" }
        address: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        kind: { type: string, enum: [reclamo, queja] }
        amount_cents: { type: integer, nullable: true }
        detail: { type: string, description: Detalle del reclamo o queja }
        request: { type: string, description: Pedido del consumidor }
    ComplaintCreated:
      type: object
      required: [code, created_at]
      properties:
        code: { type: string, example: R-2026-000001 }
        created_at: { type: string, format: date-time }
    ApiError:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
        code: { type: string }
    PlanStatus:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [PROCESSING, READY, FAILED] }
        error_message: { type: string }
        progress_stage:
          type: string
          nullable: true
          enum: [TOPICS, SESSIONS, CONTENT]
          description: Etapa de la generación; null si aún no empezó.
        progress_done: { type: integer, description: Sesiones con material preparado (etapa CONTENT). }
        progress_total: { type: integer, description: Sesiones del plan (etapa CONTENT); 0 antes. }
    Plan:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string, enum: [PROCESSING, READY, FAILED] }
        goal_id: { type: integer }
        document_ids:
          type: array
          items: { type: integer }
        error_message:
          type: string
          description: Mensaje saneado del fallo, vacío si status != FAILED.
        progress_stage:
          type: string
          nullable: true
          enum: [TOPICS, SESSIONS, CONTENT]
          description: Etapa de la generación; null si aún no empezó.
        progress_done: { type: integer, description: Sesiones con material preparado (etapa CONTENT). }
        progress_total: { type: integer, description: Sesiones del plan (etapa CONTENT); 0 antes. }
        topics:
          type: array
          items: { $ref: "#/components/schemas/PlanTopic" }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }
    PlanTopic:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        subtopics:
          type: array
          items: { type: string }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        relevance: { type: number }
        selected: { type: boolean }
        mastery:
          type: number
          nullable: true
          description: Dominio 0..1 (media móvil de los exámenes); null = sin datos (cuenta como 0.5).
        review_box:
          type: integer
          description: Escalón de la escalera de repasos (REVIEW_INTERVALS_DAYS).
        mastery_state:
          type: string
          enum: [SIN_DATOS, REFORZAR, EN_PROGRESO, DOMINADO]
        priority:
          type: number
          description: relevance × (1 − dominio); decide qué repaso va primero.
    SessionSummary:
      type: object
      properties:
        id: { type: integer }
        order_index: { type: integer }
        topic_name: { type: string }
        duration_minutes: { type: integer }
        review_offset_days: { type: integer }
        status: { type: string, enum: [PENDING, COMPLETED] }
        kind: { type: string, enum: [NEW, REVIEW] }
        topic_id: { type: integer, nullable: true }
        scheduled_date:
          type: string
          format: date
          nullable: true
          description: Fecha sugerida (UTC). Null en sesiones anteriores a la ruta adaptativa.
        reinforcement_status: { type: string, enum: [NONE, PROCESSING, READY, FAILED] }
        last_result:
          description: >-
            Último test enviado (solo en `Plan.sessions`; null si nunca se envió).
            En v1, `correct` y `total` cuentan preguntas de opción múltiple.
            En v2 cuentan las preguntas con una clave objetiva.
          nullable: true
          type: object
          properties:
            score: { type: number }
            correct: { type: integer }
            total: { type: integer }
            created_at: { type: string, format: date-time }
    QuizResult:
      type: object
      properties:
        score: { type: number, description: "% de aciertos en opción múltiple" }
        correct: { type: integer }
        total: { type: integer, description: Preguntas de opción múltiple respondidas }
        detail:
          type: object
          description: Por id de pregunta, `multiple_choice` (correct, selected, expected) o `flashcard` (quality).
    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/SessionSummary"
        - type: object
          properties:
            plan_id: { type: integer }
            completed_at: { type: string, format: date-time, nullable: true }
            material:
              type: object
              nullable: true
              properties:
                content_markdown: { type: string }
                youtube_keywords:
                  type: array
                  items: { type: string }
            review_points:
              type: array
              description: Preguntas falladas del examen que creó este repaso. Vacío para contenido v2.
              items:
                type: object
                properties:
                  prompt: { type: string }
                  answer: { type: string }
            reinforcement_error: { type: string }
    LearningMode:
      type: object
      required: [content_version]
      properties:
        content_version: { type: integer, enum: [1, 2] }
    AdaptiveLesson:
      type: object
      required: [session_id, content_version, snapshot, lesson_blocks, content_markdown]
      properties:
        session_id: { type: integer }
        content_version: { type: integer, enum: [2] }
