      properties:
        id: {type: string, maxLength: 80, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'}
        objective_ids:
          items: {type: string, maxLength: 80, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'}
          type: array
          maxItems: 12
          minItems: 1
        origin:
          type: string
          enum: [derived, generated_example]
        source_id:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
          nullable: true
        kind:
          type: string
          enum: [case]
        body_markdown: {type: string, maxLength: 4000, minLength: 1}
      additionalProperties: false
      type: object
      required: [id, title, objective_ids, origin, kind, body_markdown]
    LongTextStimulus:
      properties:
        id: {type: string, maxLength: 80, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'}
        objective_ids:
          items: {type: string, maxLength: 80, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'}
          type: array
          maxItems: 12
          minItems: 1
        origin:
          type: string
          enum: [derived]
        source_id:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
          nullable: true
        kind:
          type: string
          enum: [long_text]
        body_markdown: {type: string, maxLength: 4000, minLength: 1}
      additionalProperties: false
      type: object
      required: [id, title, objective_ids, origin, kind, body_markdown]
    SvgStimulus:
      description: Dibujo generado por la IA (solo proveedores rich_content). Se guarda ya saneado con una allowlist SVG y se muestra en <img>.
      properties:
        id: {type: string, maxLength: 80, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'}
        title: {type: string, maxLength: 160, minLength: 1}
        objective_ids: {type: array, items: {type: string}, minItems: 1, maxItems: 12}
        origin: {type: string, enum: [generated_example]}
        source_id: {type: string, nullable: true}
        kind: {type: string, enum: [svg]}
        svg: {type: string, maxLength: 20000}
        text_alternative: {type: string, minLength: 1, maxLength: 24000}
      additionalProperties: false
      type: object
      required: [id, title, objective_ids, origin, kind, svg, text_alternative]
    FigureStimulus:
      description: Figura de un documento del estudiante; asset_id debe aparecer como [figura:N] en el fragmento citado. Se sirve en /documents/figures/{asset_id}.
      properties:
        id: {type: string, maxLength: 80, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'}
        title: {type: string, maxLength: 160, minLength: 1}
        objective_ids: {type: array, items: {type: string}, minItems: 1, maxItems: 12}
        origin: {type: string, enum: [derived]}
        source_id: {type: string}
        kind: {type: string, enum: [figure]}
        asset_id: {type: integer, minimum: 1}
        text_alternative: {type: string, minLength: 1, maxLength: 24000}
      additionalProperties: false
      type: object
      required: [id, title, objective_ids, origin, source_id, kind, asset_id, text_alternative]
    AssessmentMatchingItem:
      properties:
        id: {type: string, minLength: 1}
        text: {type: string, minLength: 1}
      additionalProperties: false
      type: object
      required: [id, text]
    AssessmentSequenceItem:
      properties:
        id: {type: string, minLength: 1}
        text: {type: string, minLength: 1}
      additionalProperties: false
      type: object
      required: [id, text]
    AssessmentRubricCriterion:
      properties:
        criterion_id: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        descriptors:
          items: {type: string}
          type: array
      additionalProperties: false
      type: object
      required: [criterion_id, description]
    AssessmentMatchingPair:
      properties:
        left_id: {type: string, minLength: 1}
        right_id: {type: string, minLength: 1}
      additionalProperties: false
      type: object
      required: [left_id, right_id]
    GroundedAssessmentFeedback:
      properties:
        mode:
          type: string
          enum: [formula, chapter_reference, counterargument]
        text: {type: string, maxLength: 1400, minLength: 1}
        source_id: {type: string, nullable: true}
      additionalProperties: false
      type: object
      required: [mode, text]
    ProcedureRubricWeights:
      properties:
        result: {type: number, maximum: 1.0, exclusiveMinimum: true, minimum: 0.0}
        procedure: {type: number, maximum: 1.0, exclusiveMinimum: true, minimum: 0.0}
      additionalProperties: false
      type: object
      required: [result, procedure]
    DiagramNode:
      properties:
        id: {type: string, maxLength: 80, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'}
        label: {type: string, maxLength: 160, minLength: 1}
      additionalProperties: false
      type: object
      required: [id, label]
    DiagramEdge:
      properties:
        from_id: {type: string, maxLength: 80, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'}
        to_id: {type: string, maxLength: 80, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'}
        label: {type: string, maxLength: 160, minLength: 1}
      additionalProperties: false
      type: object
      required: [from_id, to_id, label]
    GraphSeries:
      properties:
        name: {type: string, maxLength: 160, minLength: 1}
        points:
          items: {$ref: '#/components/schemas/GraphPoint'}
          type: array
          maxItems: 30
          minItems: 1
      additionalProperties: false
      type: object
      required: [name, points]
    GraphPoint:
      properties:
        x:
          anyOf:
            - {type: string, maxLength: 160, minLength: 1}
            - {type: number}
        y: {type: number}
      additionalProperties: false
      type: object
      required: [x, y]
    PedagogySnapshot:
      type: object
      additionalProperties: false
      required:
        [name, rules, bloom_levels, allowed_question_types, primary_evaluation_criterion,
         estimated_minutes_per_question, feedback_modes, snapshot_schema_version,
         profile_id, profile_version, objectives]
      properties:
        snapshot_schema_version: { type: integer, enum: [2] }
        profile_id:
          type: string
          enum: [logical_deductive, critical_argumentative, linguistic_interpretive, systemic_empirical, applied_practical, general]
        profile_version: { type: integer, minimum: 1 }
        name: { type: string }
        discipline_examples: { type: array, items: { type: string } }
        rules: { type: array, items: { type: string } }
        bloom_levels: { type: array, items: { $ref: "#/components/schemas/BloomLevel" } }
        allowed_question_types:
          type: array
          items: { type: string, enum: [multiple_choice, true_false, short_answer, essay, step_by_step, matching] }
        primary_evaluation_criterion: { type: string, enum: [accuracy, procedure, argumentation] }
        estimated_minutes_per_question: { $ref: "#/components/schemas/MinuteRange" }
        question_time_overrides:
          type: object
          additionalProperties: { $ref: "#/components/schemas/MinuteRange" }
        feedback_modes:
          type: array
          items: { type: string, enum: [formula, chapter_reference, counterargument] }
        procedure_rubric_weights:
          type: object
          nullable: true
          additionalProperties: false
          required: [result, procedure]
          properties:
            result: { type: number }
            procedure: { type: number }
        objectives: { type: array, items: { $ref: "#/components/schemas/LearningObjective" } }
    LegacyPedagogySnapshot:
      type: object
      additionalProperties: false
      required: [profile_id, profile_version, rules, objectives]
      properties:
        profile_id: { type: string, enum: [history, mathematics, general] }
        profile_version: { type: integer, minimum: 1 }
        rules: { type: array, items: { type: string } }
        objectives: { type: array, items: { $ref: "#/components/schemas/LegacyLearningObjective" } }
    LearningObjective:
      type: object
      additionalProperties: false
      required: [id, skill, description, bloom_target]
      properties:
        id: { type: string }
        skill: { type: string }
        description: { type: string }
        bloom_target: { $ref: "#/components/schemas/BloomLevel" }
    LegacyLearningObjective:
      type: object
      additionalProperties: false
      required: [id, skill, description]
      properties:
        id: { type: string }
        skill: { type: string }
        description: { type: string }
    BloomLevel:
      type: string
      enum: [remember, understand, apply, analyze, evaluate, create]
    MinuteRange:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min: { type: integer, minimum: 1 }
        max: { type: integer, minimum: 1 }
    ProviderCatalogEntry:
      type: object
      properties:
        provider: { type: string, enum: [ANTHROPIC, OPENAI, DEEPSEEK, OPENROUTER, NVIDIA, OLLAMA, GEMINI, CLAUDE_CODE, OPENCODE, PI, CODEX] }
        label: { type: string }
        requires_model_selection: { type: boolean }
        default_model: { type: string }
        default_base_url: { type: string, nullable: true }
        common_models:
          type: array
          description: Ordenados con los modelos gratuitos primero, luego de más barato a más caro.
          items:
            type: object
            properties:
              id: { type: string }
              free: { type: boolean }
        key_placeholder:
          type: string
          description: Sugerencia visual del formato de clave de este proveedor (p. ej. "hf_...").
        requires_api_key: { type: boolean }
        supports_model_discovery: { type: boolean }
        supports_custom_base_url:
          type: boolean
          description: Si admite un override de URL base; Anthropic, Google Gemini, NVIDIA y Ollama no lo admiten.
        allows_custom_model:
          type: boolean
          description: Si admite IDs de modelo no presentes en el catálogo. NVIDIA solo permite sus modelos con contrato StudyAI validado.
        installed:
          type: boolean
          nullable: true
          description: >-
            Solo IA de terminal (CLAUDE_CODE, OPENCODE, PI, CODEX): si el binario está en el PATH del
            servidor. Nulo para los proveedores por API. En saas estas entradas no se listan.
    LLMCredential:
      type: object
      description: La clave real nunca se expone; solo un fragmento enmascarado.
      properties:
        provider: { type: string, enum: [ANTHROPIC, OPENAI, DEEPSEEK, OPENROUTER, NVIDIA, OLLAMA, GEMINI, CLAUDE_CODE, OPENCODE, PI, CODEX] }
        label: { type: string }
        masked_api_key: { type: string, example: "sk-a••••••9f2k" }
        model:
          type: string
          description: Borrador del modelo elegido; vacío si aún no se eligió uno.
        base_url: { type: string }
        is_active: { type: boolean }
        config_revision: { type: integer, minimum: 1 }
        is_verified:
          type: boolean
          description: Evidencia del servidor vigente para el modelo, URL y revisión actuales.
        verified_at: { type: string, format: date-time, nullable: true }
        requires_model_selection: { type: boolean }
        requires_api_key: { type: boolean }
        supports_model_discovery: { type: boolean }
        supports_custom_base_url: { type: boolean }
        allows_custom_model: { type: boolean }
        created_at: { type: string, format: date-time }
    LLMRuntime:
      type: object
      required: [source, provider, models, fallback_reason]
      description: Estado de selección; no garantiza conectividad futura ni contiene claves.
      properties:
        source: { type: string, enum: [USER, ENV, MOCK] }
        provider:
          type: string
          enum: [ANTHROPIC, OPENAI, DEEPSEEK, OPENROUTER, NVIDIA, OLLAMA, GEMINI, CLAUDE_CODE, OPENCODE, PI, CODEX]
          nullable: true
          description: Nulo solo si source es MOCK; USER requiere un proveedor real y ENV requiere ANTHROPIC, salvo bundled=true (NVIDIA o GEMINI).
        models:
          type: object
          required: [topic_analysis, session_plan, session_content]
          additionalProperties: false
          properties:
            topic_analysis: { type: string, minLength: 1 }
            session_plan: { type: string, minLength: 1 }
            session_content: { type: string, minLength: 1 }
          description: Modelo efectivo por tipo de llamada de generación; para Anthropic de .env, topic_analysis y session_plan usan LLM_MODEL_PLAN y session_content usa LLM_MODEL_QUIZ. MOCK usa "simulado" para las tres claves.
        fallback_reason:
          type: string
          nullable: true
          description: Motivo público saneado cuando se degradó desde una fuente de mayor prioridad.
        bundled:
          type: boolean
          default: false
          description: Verdadero cuando responde la IA gratuita incluida del servidor (NVIDIA y luego Gemini); el usuario no elige modelo.
        free_ai:
          type: object
          nullable: true
          required: [limit, used, remaining]
          description: Cupo del día (UTC) de la IA gratuita incluida; nulo si el servidor no la ofrece. Cada generación de plan gasta un uso y se devuelve si falla.
          properties:
            limit: { type: integer, minimum: 1 }
            used: { type: integer, minimum: 0 }
            remaining: { type: integer, minimum: 0 }
    LLMProviderError:
      type: object
      required: [detail, code, retryable]
      properties:
        detail:
          type: string
          description: Mensaje público saneado; no contiene cuerpos upstream ni secretos.
        code:
          type: string
          enum: [LLM_AUTHENTICATION_FAILED, LLM_ACCESS_DENIED, LLM_ASYNC_RESULT_UNAVAILABLE, LLM_QUOTA_EXHAUSTED, LLM_MODEL_UNAVAILABLE, LLM_ENDPOINT_OR_MODEL_UNAVAILABLE, LLM_UNSUPPORTED_REQUEST, LLM_UNSUPPORTED_CONFIGURATION, LLM_RATE_LIMITED, LLM_TIMEOUT, LLM_CONNECTION_FAILED, LLM_PROVIDER_UNAVAILABLE, LLM_OUTPUT_LIMIT, LLM_REFUSED, LLM_INVALID_RESPONSE, LLM_PROVIDER_ERROR]
        provider: { type: string, nullable: true }
        upstream_status: { type: integer, nullable: true }
        retryable: { type: boolean }
        retry_after_seconds: { type: number, nullable: true }
