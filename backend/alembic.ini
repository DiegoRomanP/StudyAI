# Alembic configuration.
# self_hosted (SQLite) creates tables with `create_all` at startup; DEPLOYMENT_MODE=saas uses these
# migrations instead (see docs/backend/arquitectura/base-de-datos.md):
#   alembic revision --autogenerate --rev-id 0002_<topic> -m "<topic>"
#   alembic upgrade head
# The database URL is read from Settings in env.py (not hard-coded here).

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
