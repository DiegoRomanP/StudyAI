# Alembic configuration.
# The MVP creates tables via SQLAlchemy `create_all` at startup, so Alembic is
# optional. It is configured here for when you want versioned migrations:
#   alembic revision --autogenerate -m "message"
#   alembic upgrade head
# The database URL is read from Settings in env.py (not hard-coded here).

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
