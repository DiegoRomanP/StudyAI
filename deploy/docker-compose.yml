services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: /opt/studyai/.env
    environment:
      DEPLOYMENT_MODE: saas
    expose:
      - "8001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-studyinflow.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
