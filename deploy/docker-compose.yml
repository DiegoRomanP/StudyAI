services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: /opt/studyai/.env
    environment:
      DEPLOYMENT_MODE: saas
      # api is reachable only through Caddy (expose, not ports), and Caddy overwrites X-Forwarded-For,
      # so uvicorn may trust it: the rate limit then sees the real client IP, not Caddy's.
      FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-studyinflow.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
